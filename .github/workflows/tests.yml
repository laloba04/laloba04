name: Tests

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python gen/build.py
      - run: python tools/validate.py
      - run: pytest -q
